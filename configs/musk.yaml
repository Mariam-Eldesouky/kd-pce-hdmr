# NOT USED in the final experiments: the Musk teacher did not generalise to unseen molecules
# (test AUC 0.793 +- 0.101 over 5 seeds under a molecule-grouped split). Kept for the record.
name: musk
openml_id: 1116
target: "class"
positive_label: "1"        # musk = 1, non-musk = 0
group_column: molecule_name   # used only for the grouped split, never as a feature
drop_columns: [conformation_name]   # OpenML already marks it as ignored; listed for safety

teacher:
  max_depth: [3, 5, 7]
  learning_rate: [0.05, 0.1]
  max_n_estimators: 2000
  early_stopping_rounds: 50

pce:
  p: [1, 2, 3, 4]
  r: [1, 2]                # r = 3 only on MAGIC
  q: [1.0, 0.75]
  screening_k: [10, 20, 30, 50]
  first_order_on_all_features: [true, false]
  max_terms: 20000

ebm:
  interactions: [0, 5, 10, 20]

mc_sobol:
  N: 2000
  N_quick: 500
