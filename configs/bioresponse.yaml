# High-dimensional dataset (replaces Musk; see README / decisions log).
name: bioresponse
openml_id: 4134
target: "target"
positive_label: "1"        # biological response = 1
group_column: null
drop_columns: []

teacher:
  max_depth: [3, 5, 7]
  learning_rate: [0.05, 0.1]
  max_n_estimators: 2000
  early_stopping_rounds: 50

pce:
  p: [1, 2, 3, 4]
  r: [1, 2]                # r = 3 only on MAGIC
  q: [1.0, 0.75]
  screening_k: [10, 20, 30, 50]
  first_order_on_all_features: [true, false]
  max_terms: 20000
  extra_grids:             # added after the 5-seed run: k=50 (grid edge) was selected on 4 of 5 seeds
    - {p: [2, 3], r: [2], screening_k: [100]}

pce_quick:            # --quick: smaller grid
  p: [1, 2, 3]
  r: [1, 2]
  q: [1.0]
  screening_k: [10, 30]
  first_order_on_all_features: [true]
  max_terms: 20000

ebm:
  primary_importance: mean_abs   # EBM explanation used in figures/tables: mean |contribution|, because
                           # sum Var(terms) / Var(prediction) = 0.23 +- 0.03 here: variance shares are
                           # not a decomposition (strongly co-varying terms)
  interactions: [0, 5, 10, 20]
  cv_folds: 3              # K chosen by CV R^2 on the pool
  kwargs:
    n_jobs: 2              # limit parallel processes: the 7.3 GB machine ran out of memory
    outer_bags: 4          # default 14: 397.7 s vs 173.9 s per fit (K=0) for test R^2 0.757 vs 0.755

ebm_quick:
  interactions: [0, 10]
  cv_folds: 3
  kwargs:
    n_jobs: 2
    outer_bags: 4

mc_sobol:
  N: 2000
  N_quick: 500
