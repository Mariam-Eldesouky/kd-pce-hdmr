name: magic
openml_id: 1120
target: "class:"
positive_label: "g"        # gamma (signal) = 1, hadron (background) = 0
group_column: null         # no natural groups
drop_columns: []

teacher:
  max_depth: [3, 5, 7]
  learning_rate: [0.05, 0.1]
  max_n_estimators: 2000
  early_stopping_rounds: 50

pce:
  p: [1, 2, 3, 4]
  r: [1, 2, 3]
  q: [1.0, 0.75]
  screening_k: null        # no screening for 10 features
  max_terms: 20000

pce_quick:            # --quick: smaller grid
  p: [1, 2, 3]
  r: [1, 2]
  q: [1.0]
  screening_k: null
  max_terms: 20000

ebm:
  interactions: [0, 5, 10, 20]
  cv_folds: 5              # K chosen by CV R^2 on the pool
  kwargs:                  # interpret defaults (outer_bags=14, max_bins=1024), except:
    n_jobs: 3              # limit parallel processes: the 7.3 GB machine ran out of memory

ebm_quick:
  interactions: [0, 10]
  cv_folds: 3
  kwargs:
    n_jobs: 3

mc_sobol:
  N: 10000
  N_quick: 2000
